<header>
  <div class="header-inner">
    <div class="brand" (click)="go('report')">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21C12 21 4 15.5 4 9.8C4 6.6 6.4 4 9.4 4C10.9 4 12 4.9 12 4.9C12 4.9 13.1 4 14.6 4C17.6 4 20 6.6 20 9.8C20 15.5 12 21 12 21Z" stroke="#E9A23B" stroke-width="1.6"/>
      </svg>
      <span class="brand-name">RescueLink</span>
    </div>

    <nav *ngIf="user() as u; else loggedOut">
      <a href="javascript:void(0)" (click)="go('report')">Report a Case</a>
      <a href="javascript:void(0)" (click)="go('feed')">Nearby Cases</a>
      <div class="account-area">
        <div class="avatar">{{ getInitials(u.fullName) }}</div>
        <div class="account-name">{{ u.fullName }}<span class="role">{{ u.role }}</span></div>
        <button class="logout-btn" (click)="logout()">Log Out</button>
      </div>
    </nav>

    <ng-template #loggedOut>
      <nav>
        <button class="signin-btn" (click)="go('login')">Sign Up / Log In</button>
      </nav>
    </ng-template>
  </div>
</header>
