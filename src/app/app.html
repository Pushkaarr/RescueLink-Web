<app-navbar (navigate)="setView($event)"></app-navbar>

<div class="page-content">
  <app-signup *ngIf="currentView === 'signup'"></app-signup>
  <app-login *ngIf="currentView === 'login'" (loggedIn)="onLoginSuccess()"></app-login>
  <app-report-case *ngIf="currentView === 'report'"></app-report-case>
  <app-case-feed *ngIf="currentView === 'feed'" (viewCase)="onViewCase($event)"></app-case-feed>
  <app-case-detail *ngIf="currentView === 'case'" [caseId]="selectedCaseId"></app-case-detail>
</div>
